name: Build and publish Windows release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x

      - name: Publish self-contained executable
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          dotnet publish AssistantArsef.csproj -c Release -r win-x64 --self-contained true -p:Version=$version -p:AssemblyVersion=$version.0 -p:FileVersion=$version.0 -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer and portable archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item publish\DivaCartoucheAssistant.exe artifacts\DivaCartoucheAssistant.exe
          Compress-Archive -Path artifacts\DivaCartoucheAssistant.exe -DestinationPath artifacts\DivaCartoucheAssistant-win-x64.zip -Force
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\DivaCartoucheAssistant.iss
          Get-FileHash artifacts\DivaCartoucheAssistant-Setup.exe, artifacts\DivaCartoucheAssistant-win-x64.zip -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLowerInvariant())  $($_.Path | Split-Path -Leaf)" } |
            Set-Content artifacts\checksums.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release create $env:GITHUB_REF_NAME artifacts\DivaCartoucheAssistant-Setup.exe artifacts\DivaCartoucheAssistant-win-x64.zip artifacts\checksums.txt --title "Diva Cartouche Assistant $env:GITHUB_REF_NAME" --generate-notes
